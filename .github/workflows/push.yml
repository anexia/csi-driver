on:
  push:
    branches:
    - "main"
    tags:
    - "*"
  pull_request: {}
  release:
    types:
      - published

name: CI Build & Test
jobs:
  review-go:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
         go-version-file: "go.mod"
      - name: check if go.mod and go.sum are tidy
        run: make depscheck

      - name: check code format
        run: make fmtcheck

  review-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-hadolint@v1
        with:
          reporter: github-pr-review
          level: info
          filter_mode: file

  tests:
    runs-on: ubuntu-latest
    permissions:
      # needed to commit the coverage badge to the "badges" branch
      contents: write
      # needed to post the coverage report as a PR comment
      pull-requests: write
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
         go-version-file: "go.mod"

      - name: run unit tests
        run: make test

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage.out

      # fetch the coverage breakdown of the latest successful main build so
      # the report below can show the coverage difference against main.
      - name: download main coverage breakdown
        id: download-main-breakdown
        uses: dawidd6/action-download-artifact@v24
        with:
          branch: main
          workflow_conclusion: success
          name: main.breakdown
          if_no_artifact_found: warn

      # generates the coverage report and badge. No thresholds are set, so
      # this step never fails the build. For pushes to main it commits the
      # badge to the orphan "badges" branch so README.md can embed it from
      # raw.githubusercontent.com without any third party service.
      - name: publish coverage badge
        id: coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          breakdown-file-name: ${{ github.ref_name == 'main' && 'main.breakdown' || '' }}
          diff-base-breakdown-file-name: ${{ steps.download-main-breakdown.outputs.found_artifact == 'true' && 'main.breakdown' || '' }}
          git-token: ${{ github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

      - name: upload main coverage breakdown
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v7
        with:
          name: main.breakdown
          path: main.breakdown
          if-no-files-found: error

      # the token is read-only for PRs from forks and dependabot, so a failed
      # comment must not fail the build.
      - name: post coverage report to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: coverage-report
          message: |
            go-test-coverage report:
            ```
            ${{ fromJSON(steps.coverage.outputs.report) }}```

  docker-build:
    runs-on: ubuntu-latest
    needs:
    - review-go
    - review-docker
    steps:
      - uses: actions/checkout@v7

      # try to log into our Harbor, but continue without pushing when secrets
      # not available (e.g. when PR from a fork or dependabot). Sadly, the
      # secrets context is not available in jobs/steps.if but we copy the
      # HARBOR_USER secret into the environment and check that instead.
      - uses: docker/login-action@v4
        id: docker_login
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
        if: ${{ env.HARBOR_USER != null }}
        with:
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_SECRET }}
          registry: anx-cr.io

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            anx-cr.io/anexia/csi-driver
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        id:   docker_build
        with:
          push: ${{ steps.docker_login.outcome == 'success' }}
          build-args: version=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: |
            ${{ steps.meta.outputs.tags }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.docker_build.outputs.imageid }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

